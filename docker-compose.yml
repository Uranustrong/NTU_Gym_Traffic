services:
  postgres:
    image: postgres:18
    container_name: gym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-songhejun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:-gym_fetch}
    # Bind to loopback only so other users on a shared host (e.g. CSIE
    # workstations) can't reach the database. Override with PG_BIND_ADDR
    # in .env if you need cross-host access.
    ports:
      - "${PG_BIND_ADDR:-127.0.0.1}:5433:5432"
    volumes:
      # Postgres 18+ expects the mount at /var/lib/postgresql (not .../data);
      # the image stores data in a version-numbered subdir (e.g. /var/lib/postgresql/18)
      # so pg_upgrade --link works cleanly across major-version bumps.
      - gym-postgres-data:/var/lib/postgresql
      # Schema and views come straight from sql/migrations/ so there is only
      # one definition to keep correct. Roles/RLS (003, 004) are deliberately
      # not mounted: they need passwords passed as psql variables, which the
      # initdb hook cannot supply, and local development does not need them.
      # Run tools/apply_migrations.sh against the container if you do.
      - ./sql/migrations/001_occupancy.sql:/docker-entrypoint-initdb.d/001_occupancy.sql:ro
      - ./sql/grafana_weekly_views.sql:/docker-entrypoint-initdb.d/002_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:13.0.1
    container_name: gym-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD missing in .env}
      GF_INSTALL_PLUGINS: "volkovlabs-echarts-panel 7.2.4"
      # Anonymous read-only viewer access. Required for the public snapshot
      # workflow on ws7 (see docs/SERVER_SETUP.md). Defaults to false so the
      # local-dev deployment still requires login.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      # Substituted into datasources.yml at provisioning time.
      # Defaults target the postgres service in this compose network. To point
      # the dashboard at Supabase instead, override DS_PG_* in the local env
      # file - see the header of grafana/provisioning/datasources/datasources.yml.
      DS_PG_HOST: ${DS_PG_HOST:-postgres}
      DS_PG_PORT: ${DS_PG_PORT:-5432}
      DS_PG_DB: ${DS_PG_DB:-${POSTGRES_DB:-gym_fetch}}
      DS_PG_USER: ${DS_PG_USER:-${POSTGRES_USER:-songhejun}}
      DS_PG_PASSWORD: ${DS_PG_PASSWORD:-${POSTGRES_PASSWORD:?POSTGRES_PASSWORD missing in the local env file}}
      DS_PG_SSLMODE: ${DS_PG_SSLMODE:-disable}
      DS_PG_VERSION: ${DS_PG_VERSION:-1800}
    # Bind to loopback only by default (see PG_BIND_ADDR comment above).
    ports:
      - "${GRAFANA_BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - gym-grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/weekly-dashboard.json:/var/lib/grafana/dashboards/weekly-dashboard.json:ro

volumes:
  gym-postgres-data:
  gym-grafana-data:
