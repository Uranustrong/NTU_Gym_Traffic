name: publish

# Deploys the public page. It is no longer a data pipeline.
#
# This used to run every five minutes because the page had the readings baked
# into it, so freshness was capped by deploy frequency. The page now calls
# public.gym_heatmap() and public.gym_live() on Supabase from the browser, so
# it is deployed once and stays live by itself -- which means this only needs
# to run when the code that builds the page changes.
#
# Consequences worth knowing: it holds no database credentials at all any more,
# and the pg_cron jobs that used to dispatch it have been unscheduled.

on:
  push:
    # branches AND paths. With paths alone, a push to any feature branch that
    # happened to touch tools/ would deploy itself to the production Pages site.
    branches: [main]
    paths:
      - "tools/render_public_html.py"
      - "tools/public_template.html"
      - "tools/echarts.min.js"
      - "grafana/weekly-dashboard.json"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress is false on GitHub's own advice for Pages: a deployment
# killed midway is worse than one that finishes and is immediately superseded.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Variables, not secrets. The publishable key ends up in the page source
      # by design -- it is the credential every Supabase browser client ships --
      # and masking it in logs would only make failures harder to read.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      PUBLISH_DAYS: ${{ vars.PUBLISH_DAYS }}
    steps:
      # Required, and easy to leave out: the script, the HTML template and the
      # bundled echarts.min.js all live in the repo.
      - uses: actions/checkout@v7

      - name: Render
        # No --supabase-url/--supabase-key here: the script defaults them from
        # the environment, which is what lets a local build work off
        # `set -a; . ./supabase.secrets; set +a`.
        run: |
          set -euo pipefail
          python3 tools/render_public_html.py \
            --output-dir _site \
            --days "${PUBLISH_DAYS:-7}"

      - name: Sanity-check the page before it replaces a working one
        # A deploy overwrites whatever is live, and the page no longer contains
        # any data to check -- so check the wiring instead. An empty key or an
        # unsubstituted placeholder still produces perfectly valid-looking HTML
        # that 401s in every visitor's browser.
        #
        # The key's *shape* is validated in render_public_html.py, which
        # refuses to write anything for a secret or service_role key. What
        # happens here is the belt to that braces: an assertion about the file
        # actually being deployed, so a future change to the renderer cannot
        # quietly reopen the hole. A published secret key cannot be un-published;
        # it can only be rotated.
        run: |
          set -euo pipefail
          if grep -qF '{{' _site/index.html; then
            echo "::error::unsubstituted placeholder left in index.html"
            exit 1
          fi
          if ! grep -qF "$SUPABASE_URL" _site/index.html; then
            echo "::error::index.html does not point at the expected project host"
            exit 1
          fi
          for forbidden in 'sb_secret_' 'service_role'; do
            if grep -qF "$forbidden" _site/index.html; then
              echo "::error::index.html contains '$forbidden' -- refusing to publish a privileged credential"
              exit 1
            fi
          done
          # Guard the emptiness case first: grep -F "" matches every line, so
          # an unset variable would sail through the check below.
          if [ "${#SUPABASE_PUBLISHABLE_KEY}" -lt 20 ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY is empty or truncated (${#SUPABASE_PUBLISHABLE_KEY} chars)"
            exit 1
          fi
          # Asserted rather than pattern-matched, so this holds for a legacy
          # anon JWT as well as an sb_publishable_ key.
          if ! grep -qF "$SUPABASE_PUBLISHABLE_KEY" _site/index.html; then
            echo "::error::the configured key is not present in index.html; the page would 401 for every visitor"
            exit 1
          fi
          if [ ! -s _site/echarts.min.js ]; then
            echo "::error::echarts.min.js missing or empty; no chart would render"
            exit 1
          fi
          echo "index.html $(wc -c < _site/index.html) bytes, wiring looks right"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
