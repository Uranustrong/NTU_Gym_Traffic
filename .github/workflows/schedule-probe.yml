name: schedule-probe

# TEMPORARY. Delete once it has answered its question.
#
# collect.yml's schedule did not fire for the first 30 minutes after it landed.
# Two explanations fit equally well and lead to opposite fixes:
#
#   (a) GitHub is simply slow to register a new schedule -- common, and nothing
#       to do but wait.
#   (b) The `timezone` key is not being honoured and the crons are read as UTC.
#       Under that reading collect.yml's Sunday window, 09-17, would mean
#       09:00-17:59 UTC = 17:00-01:59 Taipei, so nothing would fire this
#       afternoon and readings would be collected at the wrong hours all week.
#
# The two crons below cover the SAME two hours of real time -- Taipei 14:00-15:59
# is UTC 06:00-07:59 -- one tagged with a timezone and one left as UTC. Because
# github.event.schedule reports which cron expression triggered a run, each run
# says for itself which interpretation GitHub used:
#
#   sees "*/5 14-15 * * *"  -> timezone is honoured, collect.yml is correct
#   sees only "*/5 6-7 * * *" -> timezone is ignored, every cron needs rewriting
#   sees neither            -> the scheduler is lagging, not misreading
#
# The UTC line is the control: it fires regardless, which is what separates
# "ignored" from "not registered yet".

on:
  schedule:
    - cron: "*/5 14-15 * * *"
      timezone: "Asia/Taipei"
    - cron: "*/5 6-7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Report which schedule fired
        env:
          FIRED_BY: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          echo "event:       ${{ github.event_name }}"
          echo "cron:        ${FIRED_BY:-<not a scheduled run>}"
          echo "utc now:     $(date -u +%FT%TZ)"
          echo "taipei now:  $(TZ=Asia/Taipei date +%FT%T%z)"
