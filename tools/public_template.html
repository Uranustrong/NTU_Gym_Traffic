<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No meta refresh. The page fetches its own data now, so it updates in
       place: the scroll position and the venue/palette/granularity selections
       all survive, which a full reload every five minutes destroyed. -->
  <title>NTU Sports Center · Weekly Occupancy</title>
  <script src="echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      background: #0e1117; color: #d4d4d4; margin: 0;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
    }
    header { padding: 20px 24px 8px; }
    h1 { font-weight: 300; font-size: 19px; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
    .controls label { font-size: 12px; color: #9aa; display: flex; align-items: center; gap: 6px; }
    .controls select {
      background: #1b1f27; color: #d4d4d4; border: 1px solid #333;
      border-radius: 4px; padding: 4px 8px; font-size: 12px;
    }
    .ts { color: #777; font-size: 11px; margin-top: 10px; }
    /* Staleness has to look different from freshness, or the page can show old
       numbers as confidently as new ones. */
    .ts.warn { color: #d0a24c; }
    .ts.err  { color: #c9736b; }
    main { padding: 4px 24px 24px; max-width: 1280px; margin: 0 auto; }
    .panel {
      background: #11151c; border: 1px solid #20242c; border-radius: 6px;
      margin: 14px 0; padding: 4px;
    }
    #panel1 { height: 280px; }
    #panel4 { height: 240px; }
    #panel2 { height: 580px; }
    #panel3 { height: 320px; }
    footer { padding: 8px 24px 28px; color: #666; font-size: 11px; text-align: center; }
    footer a { color: #888; text-decoration: none; }
    .err { color: #c08; font-size: 12px; padding: 12px; }
    #fatal {
      display: none; margin: 24px; padding: 16px 18px;
      border: 1px solid #43262a; border-radius: 6px; background: #1a1114;
      color: #c9736b; font-size: 13px; line-height: 1.7;
    }
    /* Renovation / maintenance notice. The elements are created and removed,
       not hidden -- an empty bordered box reads as "something is broken with
       the page" rather than "nothing is closed". */
    .closure {
      margin: 14px 24px 0; padding: 10px 14px;
      border: 1px solid #4a3f22; border-left-width: 3px; border-radius: 4px;
      background: #191509; color: #d0a24c; font-size: 13px; line-height: 1.6;
    }
    .closure b { color: #e6c07b; font-weight: 500; }
    .closure a { color: #b8925a; }
  </style>
</head>
<body>
  <header>
    <h1>NTU Sports Center · Weekly Occupancy</h1>
    <div class="controls">
      <label>Venue
        <select id="sel-venue"></select>
      </label>
      <label>Palette
        <select id="sel-palette">
          <option value="terracotta">terracotta</option>
          <option value="sage">sage</option>
          <option value="slate" selected>slate</option>
          <option value="rose">rose</option>
          <option value="teal">teal</option>
          <option value="lavender">lavender</option>
        </select>
      </label>
      <label>Granularity
        <select id="sel-granularity">
          <option value="30min">30min</option>
          <option value="60min" selected>60min</option>
        </select>
      </label>
      <label>Metric
        <select id="sel-metric">
          <option value="avg_count" selected>avg_count</option>
          <option value="crowding_ratio">crowding_ratio</option>
        </select>
      </label>
    </div>
    <div class="ts" id="status">Loading…</div>
  </header>
  <div id="fatal"></div>
  <div id="closures-anchor" hidden></div>
  <main>
    <div id="panel1" class="panel"></div>
    <div id="panel4" class="panel"></div>
    <div id="panel2" class="panel"></div>
    <div id="panel3" class="panel"></div>
  </main>
  <footer>
    Data source <a href="https://rent.pe.ntu.edu.tw/">rent.pe.ntu.edu.tw</a>
    · Public read-only view. Readings are collected every 5 minutes and this
    page reads them live.
  </footer>

  <script>
    "use strict";

    // Baked at build time by tools/render_public_html.py. Everything here is
    // configuration, never data: supabaseUrl, supabaseKey, venueDisplay,
    // panelJs, days, refreshSeconds. The runtime payload lives in DATA below
    // and only ever comes from the two RPCs.
    const CONFIG = {{CONFIG_JSON}};

    const REST = CONFIG.supabaseUrl.replace(/\/+$/, "") + "/rest/v1/rpc/";
    const PROJECT_REF = (() => {
      try { return new URL(CONFIG.supabaseUrl).hostname.split(".")[0]; }
      catch (e) { return "unknown"; }
    })();

    const CACHE_SCHEMA = 1;
    const KEY_HEATMAP = `gymdash:v${CACHE_SCHEMA}:${PROJECT_REF}:heatmap`;
    const KEY_LIVE    = `gymdash:v${CACHE_SCHEMA}:${PROJECT_REF}:live:${CONFIG.days}`;
    const HEATMAP_TTL_MS = 6 * 60 * 60 * 1000;
    // Above this, a reading is old enough to mean something is wrong rather
    // than that we are simply between collections.
    const STALE_AFTER_MS = 15 * 60 * 1000;

    // ---- venue naming -----------------------------------------------------
    // Chinese names are the stable keys everywhere: they are what the database
    // stores and what every RPC returns. English is presentation only.
    const display = (v) => (CONFIG.venueDisplay && CONFIG.venueDisplay[v]) || v;

    function translateField(series, fieldName) {
      if (!series || !series.fields) return series;
      for (const f of series.fields) {
        if (f.name === fieldName) f.values = f.values.map(display);
      }
      return series;
    }

    // ---- transport --------------------------------------------------------
    // apikey only. A publishable key (sb_publishable_...) is not a JWT, so
    // putting it in Authorization: Bearer gets it rejected as a malformed one;
    // that header is for a signed-in user's token, and there is no sign-in here.
    async function rpc(name, args) {
      const res = await fetch(REST + name, {
        method: "POST",
        headers: { "apikey": CONFIG.supabaseKey, "Content-Type": "application/json" },
        body: JSON.stringify(args || {}),
      });
      if (!res.ok) throw new Error(`${name}: HTTP ${res.status}`);
      return res.json();
    }

    // ---- cache ------------------------------------------------------------
    function cacheRead(key, maxAgeMs) {
      let raw;
      try { raw = localStorage.getItem(key); } catch (e) { return null; }
      if (!raw) return null;
      let box;
      try { box = JSON.parse(raw); } catch (e) { return null; }
      // Shape check, not just a presence check: a half-written or
      // older-schema entry must be discarded rather than rendered.
      if (!box || box.schemaVersion !== CACHE_SCHEMA || !box.payload) return null;
      if (maxAgeMs && (Date.now() - (box.savedAt || 0)) > maxAgeMs) return null;
      return box;
    }

    function cacheWrite(key, payload) {
      try {
        localStorage.setItem(key, JSON.stringify({
          schemaVersion: CACHE_SCHEMA,
          dataAsOf: payload.dataAsOf,
          savedAt: Date.now(),
          payload,
        }));
      } catch (e) { /* private mode, quota: not worth failing the page over */ }
    }

    // ---- runtime data -----------------------------------------------------
    const DATA = { venues: [], panel1History: {}, panel1Now: {}, panel2: {},
                   panel3: {}, panel4: null,
                   rawClosures: [], activeClosures: [], windowClosures: [] };
    let lastGood = { dataAsOf: null, servedAt: null, freshnessExpected: null, fromCache: false };

    const state = { venue: null, palette: "slate", granularity: "60min", metric: "avg_count" };

    function applyHeatmap(p) {
      DATA.venues = p.venues || [];
      DATA.panel2 = p.panel2 || {};
      DATA.panel1History = p.panel1History || {};
    }

    function applyLive(p) {
      DATA.panel1Now = p.panel1Now || {};
      DATA.panel3 = p.panel3 || {};
      DATA.panel4 = p.panel4 ? translateField(p.panel4, "venue") : null;
      for (const v of Object.keys(DATA.panel3)) translateField(DATA.panel3[v], "metric");
      DATA.rawClosures = p.activeClosures || [];
      // Not re-filtered against the clock the way rawClosures is. These are
      // the closures overlapping the same window panel3 was built for, and
      // both arrive in the same response -- including the cached one -- so a
      // band drawn from cache always matches the line drawn from cache.
      DATA.windowClosures = p.windowClosures || [];
      refilterClosures();
    }

    // Only gym_live decides freshness, and it is recomputed from scratch each
    // cycle rather than accumulated. Both halves of that matter:
    //
    //   - gym_heatmap carries a dataAsOf too, but it is cached for six hours by
    //     design, so folding it in would let a stamp from this morning present
    //     itself as the newest reading;
    //   - keeping the newest value ever seen would let a stamp cached while the
    //     collector was healthy mask the older one a later call actually
    //     returns, so the page would go on saying "Updated" long after
    //     collection had stopped -- the exact failure this line exists to catch.
    function noteFreshness(live, fromCache) {
      lastGood.dataAsOf = (live && live.dataAsOf) || null;
      lastGood.servedAt = (live && live.servedAt) || null;
      lastGood.freshnessExpected =
        live && typeof live.freshnessExpected === "boolean" ? live.freshnessExpected : null;
      lastGood.fromCache = !!fromCache;
    }

    // panel 1 is assembled from both calls: the typical bars and day count ride
    // with the heatmap because they are the same slow-moving historical
    // rollup, and only the "now" marker comes from the five-minute path. The
    // panel's own JS buckets rows by `kind` and sorts what it needs, so
    // concatenation order does not matter.
    function panel1For(venue) {
      const a = DATA.panel1History[venue], b = DATA.panel1Now[venue];
      if (!a) return b || null;
      if (!b) return a;
      return {
        fields: a.fields.map((f, i) => ({
          name: f.name,
          type: f.type,
          values: f.values.concat((b.fields[i] && b.fields[i].values) || []),
        })),
      };
    }

    // ---- rendering --------------------------------------------------------
    function makeContext(series) {
      return {
        panel: { data: { series: series ? [series] : [] } },
        // Public-page-only. Grafana builds its own context and has no such
        // field, so panel 4's JS sees undefined there and renders exactly as
        // it does today.
        closures: DATA.activeClosures,
        // Panel 3 only ever draws one venue, and the panel cannot do the
        // filtering itself: replaceVariables hands it the English display
        // name, never the Chinese key the API returns.
        windowClosures: DATA.windowClosures.filter(
          (c) => c.venue === state.venue),
        grafana: {
          replaceVariables: (s) => String(s)
            .split("${palette}").join(state.palette)
            // display name, so titles read "Fitness Center" while the key
            // stays Chinese
            .split("${venue}").join(display(state.venue))
            .split("${granularity}").join(state.granularity)
            .split("${metric}").join(state.metric),
        },
      };
    }

    const panelFns = {};
    for (const [id, body] of Object.entries(CONFIG.panelJs)) {
      panelFns[id] = new Function("context", body);
    }

    const charts = {};
    const PANEL_IDS = { panel1: "1", panel2: "2", panel3: "3", panel4: "4" };
    for (const key of Object.keys(PANEL_IDS)) {
      charts[key] = echarts.init(document.getElementById(key));
    }

    function seriesFor(panelKey) {
      if (!state.venue) return null;
      if (panelKey === "panel1") return panel1For(state.venue);
      if (panelKey === "panel2") return (DATA.panel2[state.venue] || {})[state.granularity];
      if (panelKey === "panel3") return DATA.panel3[state.venue];
      if (panelKey === "panel4") return DATA.panel4;
      return null;
    }

    function renderPanel(panelKey) {
      const chart = charts[panelKey];
      let option;
      try {
        option = panelFns[PANEL_IDS[panelKey]](makeContext(seriesFor(panelKey)));
      } catch (e) {
        console.error(panelKey + " render error:", e);
        chart.clear();
        return;
      }
      chart.setOption(option || {}, true);
    }

    function renderAll() {
      renderClosures();
      Object.keys(PANEL_IDS).forEach(renderPanel);
    }

    // ---- selectors --------------------------------------------------------
    const venueSel = document.getElementById("sel-venue");

    // Rebuilt whenever the venue list arrives, and careful to keep whatever the
    // viewer had chosen: the list is asynchronous now, not a build-time constant.
    function syncVenueOptions() {
      const previous = state.venue;
      venueSel.textContent = "";
      for (const v of DATA.venues) {
        const opt = document.createElement("option");
        opt.value = v;                 // Chinese: the stable key
        opt.textContent = display(v);  // English: presentation
        venueSel.appendChild(opt);
      }
      state.venue = DATA.venues.includes(previous) ? previous : DATA.venues[0] || null;
      if (state.venue) venueSel.value = state.venue;
    }

    venueSel.addEventListener("change", () => {
      state.venue = venueSel.value;
      // panel4 shows both venues, so it does not depend on venue.
      renderPanel("panel1"); renderPanel("panel2"); renderPanel("panel3");
    });
    document.getElementById("sel-palette").addEventListener("change", (e) => {
      state.palette = e.target.value; renderAll();
    });
    document.getElementById("sel-granularity").addEventListener("change", (e) => {
      state.granularity = e.target.value; renderPanel("panel2");
    });
    document.getElementById("sel-metric").addEventListener("change", (e) => {
      state.metric = e.target.value; renderPanel("panel2");
    });
    window.addEventListener("resize", () => {
      Object.values(charts).forEach((c) => c.resize());
    });

    // ---- closure banner ---------------------------------------------------
    // --- closure-span:begin (extracted by test_public_page_js.py) ---
    // Month names come from a fixed array, not Intl's `month: "short"`. That
    // formatter returns "Sept" for September on current ICU builds and "Sep"
    // on older ones, so the banner's wording would otherwise depend on which
    // browser the viewer happens to have.
    const CLOSURE_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                            "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    // Taipei wall-clock parts of an instant, whatever zone the viewer is in.
    // hourCycle "h23" rather than hour12:false: the latter renders midnight as
    // "24" under some locale/ICU combinations, which would defeat the
    // whole-day test below.
    function taipeiParts(date) {
      const parts = {};
      for (const { type, value } of new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Taipei", year: "numeric", month: "numeric",
        day: "numeric", hour: "2-digit", minute: "2-digit", hourCycle: "h23",
      }).formatToParts(date)) parts[type] = value;
      return { day: Number(parts.day), month: Number(parts.month),
               time: parts.hour + ":" + parts.minute };
    }

    function closureDay(parts) {
      return parts.day + " " + CLOSURE_MONTHS[parts.month - 1];
    }

    // Ranges are half-open [from, to). Two shapes, and they must not share a
    // formatter: a whole-day range ends on a local midnight, so the last day a
    // viewer would call "closed" is the day before it -- but the monthly
    // maintenance window ends at 17:00 the same day, and subtracting 24 hours
    // from that renders "24 Aug – 23 Aug".
    function closureSpan(fromIso, toIso) {
      const from = new Date(fromIso), to = new Date(toIso);
      const toParts = taipeiParts(to);
      if (toParts.time !== "00:00") {
        return closureDay(taipeiParts(from)) + " · until " + toParts.time;
      }
      const first = closureDay(taipeiParts(from));
      const last = closureDay(taipeiParts(new Date(to.getTime() - 86400000)));
      return first === last ? first : first + " – " + last;
    }
    // --- closure-span:end ---

    // The payload is re-checked against the clock rather than trusted.
    // applyLive() is also called with the localStorage payload at boot, and
    // that can be days old -- a viewer returning on 21 September would
    // otherwise see the renovation banner until the first network reply.
    //
    // `span` is computed once here so the banner and panel 4 print the same
    // string instead of formatting the same dates twice.
    function refilterClosures() {
      const now = Date.now();
      DATA.activeClosures = DATA.rawClosures
        .filter((c) => new Date(c.from).getTime() <= now
                    && now < new Date(c.to).getTime())
        .map((c) => ({
          venue: display(c.venue),
          reason: c.reason,
          source: c.source,
          from: c.from,
          to: c.to,
          span: closureSpan(c.from, c.to),
        }));
      scheduleClosureExpiry();
    }

    // Polling would eventually notice a closure ending, but a tab left open
    // across 2026-09-21 00:00 keeps the banner for up to a full cycle -- and
    // indefinitely if the network is down, since a failed poll re-applies
    // nothing. `to` is already in hand, so the removal is scheduled from the
    // data rather than from the next successful request.
    //
    // Chained rather than one-shot: setTimeout saturates past ~24.8 days, so a
    // closure ending five weeks out has to be re-armed rather than skipped.
    // The callback re-checks the clock and reschedules if it fired early --
    // timers are allowed to be a millisecond optimistic, and firing early
    // without this would leave the banner up until the next poll after all.
    //
    // The reverse direction (a closure *starting*) cannot be scheduled: the
    // API returns only what is active now, so that one waits for the poll.
    const MAX_TIMEOUT_MS = 2147483647;
    let closureTimer = null;
    function scheduleClosureExpiry() {
      if (closureTimer) { clearTimeout(closureTimer); closureTimer = null; }
      const now = Date.now();
      const next = DATA.activeClosures
        .map((c) => new Date(c.to).getTime())
        .filter((t) => t > now)
        .sort((a, b) => a - b)[0];
      if (next === undefined) return;
      closureTimer = setTimeout(() => {
        closureTimer = null;
        if (Date.now() < next) { scheduleClosureExpiry(); return; }
        refilterClosures();
        renderAll();
      }, Math.min(next - now, MAX_TIMEOUT_MS));
    }

    const closuresAnchor = document.getElementById("closures-anchor");

    function renderClosures() {
      // Remove the elements themselves rather than emptying a container: with
      // nothing closed there is no banner node in the document at all.
      for (const el of document.querySelectorAll(".closure")) el.remove();
      for (const c of DATA.activeClosures) {
        const div = document.createElement("div");
        div.className = "closure";
        const name = document.createElement("b");
        name.textContent = c.venue;
        div.appendChild(name);
        div.appendChild(document.createTextNode(
          " · " + c.reason + " · closed " + c.span + " "));
        // createElement rather than innerHTML: reason and venue come out of the
        // database, and interpolating viewer-visible strings into HTML is a
        // habit not worth keeping even while we are the only ones writing them.
        // Scheme-checked before it becomes an href. Only an owner credential
        // can write this column today, so this is habit rather than a hole --
        // the same habit as using createElement above instead of innerHTML.
        if (c.source && /^https?:\/\//i.test(c.source)) {
          const a = document.createElement("a");
          a.href = c.source;
          a.rel = "noopener";
          a.textContent = "(notice)";
          div.appendChild(a);
        }
        closuresAnchor.parentNode.insertBefore(div, closuresAnchor);
      }
    }

    // ---- status -----------------------------------------------------------
    const statusEl = document.getElementById("status");
    const fatalEl = document.getElementById("fatal");

    const fmtClock = new Intl.DateTimeFormat("en-GB", {
      hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Taipei",
    });

    function minutesSince(iso) {
      if (!iso) return null;
      return Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    }

    function setStatus(reachable) {
      const age = minutesSince(lastGood.dataAsOf);
      if (age === null) {
        statusEl.className = "ts err";
        statusEl.textContent = "No data yet";
        return;
      }
      const stamp = fmtClock.format(new Date(lastGood.dataAsOf)) + " CST";
      if (!reachable) {
        statusEl.className = "ts err";
        statusEl.textContent = `Showing cached data from ${stamp} (${age} min ago) · data source unreachable`;
        return;
      }
      // Judged from dataAsOf, never from "the request succeeded". A stopped
      // collector still answers 200 -- viewers polling this API are themselves
      // enough to keep the project awake -- so trusting the response would
      // quietly re-cache old numbers as if they were new.
      const overdue = lastGood.freshnessExpected && (age * 60000) > STALE_AFTER_MS;
      statusEl.className = overdue ? "ts warn" : "ts";
      statusEl.textContent = overdue
        ? `Last reading ${stamp} (${age} min ago) · collection may have stopped`
        : `Updated ${stamp}`;
    }

    function showFatal(err) {
      // The status line would otherwise sit on "Loading…" for ever, which
      // reads as "still working" rather than "gave up".
      statusEl.className = "ts err";
      statusEl.textContent = "Could not reach the data source";
      fatalEl.style.display = "block";
      fatalEl.textContent =
        "Could not load occupancy data, and there is nothing cached in this browser to fall back on. " +
        "The data source may be temporarily unavailable. (" + err.message + ")";
    }

    // ---- polling ----------------------------------------------------------
    let inFlight = false;      // never let two refreshes overlap
    let backoffMs = 0;
    let timer = null;
    let heatmapAt = 0;
    let everRendered = false;

    async function refresh({ force } = {}) {
      if (inFlight) return;
      inFlight = true;
      try {
        const needHeatmap = force || !heatmapAt || (Date.now() - heatmapAt) > HEATMAP_TTL_MS;
        const [live, heat] = await Promise.all([
          rpc("gym_live", { p_days: CONFIG.days }),
          needHeatmap ? rpc("gym_heatmap", {}) : Promise.resolve(null),
        ]);

        // Cache before applying: applyLive() rewrites venue names in place for
        // display, and a cache holding translated names would no longer match
        // the keys the RPC returns.
        if (heat) {
          cacheWrite(KEY_HEATMAP, heat);
          applyHeatmap(heat);
          heatmapAt = Date.now();
          syncVenueOptions();
        }
        cacheWrite(KEY_LIVE, live);
        applyLive(live);
        noteFreshness(live, false);

        fatalEl.style.display = "none";
        renderAll();
        everRendered = true;
        setStatus(true);
        backoffMs = 0;
      } catch (err) {
        console.error("refresh failed:", err);
        if (everRendered) setStatus(false);
        else showFatal(err);
        backoffMs = backoffMs ? Math.min(backoffMs * 2, 300000) : 5000;
      } finally {
        inFlight = false;
        schedule();
      }
    }

    function schedule() {
      if (timer) clearTimeout(timer);
      // Nothing to refresh for a tab nobody is looking at; each open tab would
      // otherwise poll 288 times a day whether or not it is on screen.
      if (document.visibilityState === "hidden") { timer = null; return; }
      timer = setTimeout(refresh, backoffMs || CONFIG.refreshSeconds * 1000);
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        // Cheap and synchronous, so a banner that expired while the tab was
        // hidden is gone before the network round trip rather than after it.
        refilterClosures();
        renderClosures();
        refresh();
      } else if (timer) { clearTimeout(timer); timer = null; }
    });

    // ---- boot -------------------------------------------------------------
    // Paint from cache first so a returning viewer sees the charts immediately,
    // then go and get the real thing. The cached view is labelled as such until
    // the network answers.
    (function boot() {
      const heatBox = cacheRead(KEY_HEATMAP, HEATMAP_TTL_MS);
      const liveBox = cacheRead(KEY_LIVE, null);
      if (heatBox) { applyHeatmap(heatBox.payload); heatmapAt = heatBox.savedAt; syncVenueOptions(); }
      if (liveBox) applyLive(liveBox.payload);
      if (heatBox || liveBox) {
        noteFreshness(liveBox && liveBox.payload, true);
        renderAll();
        everRendered = true;
        setStatus(false);
      }
      refresh({ force: !heatBox });
    })();
  </script>
</body>
</html>
