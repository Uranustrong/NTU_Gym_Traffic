'#dde7e5','#a8c2bf','#6fa097','#487a72','#2e5953','#1a3833'],\n  lavender:   ['#e7e1ec','#c5b4d3','#a08abb','#7e639d','#5a417a','#3a2855'],\n};\nconst len = (v) => (typeof v.length === 'number' ? v.length : (v.toArray ? v.toArray().length : 0));\nconst at  = (v, i) => (typeof v.get === 'function' ? v.get(i) : v[i]);\n\nconst series = context.panel.data.series && context.panel.data.series[0];\nif (!series || !series.fields) return {};\nconst f = (n) => { const x = series.fields.find(x => x.name === n); return x ? x.values : null; };\nconst kindF = f('kind');\nconst hourF = f('hour');\nconst cntF  = f('count');\nconst sampF = f('samples');\nif (!kindF || !hourF || !cntF || len(kindF) === 0) return {};\n\nconst paletteName = context.grafana.replaceVariables('${palette}');\nconst stops = PALETTES[paletteName] || PALETTES.slate;\nconst NEUTRAL_BAR = stops[3];\nconst venueName = context.grafana.replaceVariables('${venue}');\n\nconst fmtHour = new Intl.DateTimeFormat('en-GB', { hour: 'numeric', hour12: false, timeZone: 'Asia/Taipei' });\nconst currentHour = parseInt(fmtHour.format(new Date()), 10);\nconst weekdayShort = new Intl.DateTimeFormat('en', { weekday: 'short', timeZone: 'Asia/Taipei' }).format(new Date());\n\nconst typicalRows = [];\nlet nowRow = null;\nlet nDays = null;\nfor (let i = 0; i < len(kindF); i++) {\n  const kind = at(kindF, i);\n  const hour = at(hourF, i);\n  const count = at(cntF, i);\n  const samples = at(sampF, i);\n  if (kind === 'typical') typicalRows.push({ hour, count, samples });\n  else if (kind === 'now') nowRow = { hour, count };\n  else if (kind === 'meta') nDays = count;\n}\ntypicalRows.sort((a, b) => a.hour - b.hour);\nif (typicalRows.length === 0) return {};\n\nconst hours = typicalRows.map(r => String(r.hour).padStart(2, '0') + ':00');\nconst barData = typicalRows.map(r => ({\n  value: r.count,\n  itemStyle: { color: r.hour === currentHour ? stops[5] : NEUTRAL_BAR },\n}));\n\nconst scatterData = [];\nif (nowRow != null) {\n  const xIdx = typicalRows.findIndex(r => r.hour === nowRow.hour);\n  if (xIdx >= 0) {\n    scatterData.push({\n      value: [xIdx, nowRow.count],\n      label: { show: true, formatter: 'Now: ' + nowRow.count + ' people', position: 'top', color: '#fafafa', fontSize: 12, fontWeight: 'bold' },\n      symbol: 'none',\n    });\n  }\n}\n\nreturn {\n  title: { text: 'Typical ' + weekdayShort + ' · ' + venueName + (nDays != null ? ' · ' + nDays + (nDays === 1 ? ' day' : ' days') : ''), left: 'center', top: 6, textStyle: { color: '#ddd', fontSize: 13, fontWeight: 'normal' } },\n  grid: { left: 50, right: 30, top: 50, bottom: 30, containLabel: true },\n  xAxis: { type: 'category', data: hours, axisLabel: { color: '#aaa', fontSize: 10 } },\n  yAxis: { type: 'value', name: 'people', nameTextStyle: { color: '#888', fontSize: 10 }, axisLabel: { color: '#888', fontSize: 10 }, splitLine: { lineStyle: { color: '#222' } } },\n  tooltip: {\n    trigger: 'item',\n    formatter: (p) => {\n      if (p.seriesType === 'scatter') return 'Now: ' + (nowRow ? nowRow.count : '-') + ' people';\n      const r = typicalRows[p.dataIndex];\n      return weekdayShort + ' ' + hours[p.dataIndex] + '<br/>' + 'avg ' + Number(r.count).toFixed(0) + ' people<br/>' + 'based on ' + r.samples + ' readings';\n    },\n  },\n  series: [\n    { type: 'bar', data: barData, barWidth: '60%' },\n    { type: 'scatter', data: scatterData, symbolSize: 0, z: 5 },\n  ],\n};\n","2":"const PALETTES = {  terracotta: ['#ede4d4','#d8c4a0','#caa479','#b8754f','#974a3a','#642822'],\n  sage:       ['#e8e7d6','#c9d2b3','#9eb288','#728c64','#4f6948','#2e4530'],\n  slate:      ['#e6ebef','#bdcad4','#8ea1b1','#5e7689','#3d556a','#22344a'],\n  rose:       ['#ece1de','#dbb9b9','#c08e95','#9a5e72','#6d3f56','#412236'],\n  teal:       ['#dde7e5','#a8c2bf','#6fa097','#487a72','#2e5953','#1a3833'],\n  lavender:   ['#e7e1ec','#c5b4d3','#a08abb','#7e639d','#5a417a','#3a2855'],\n};\n\nconst series = context.panel.data.series && context.panel.data.series[0];\nif (!series || !series.fields) return {};\nconst hexToRgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];\nconst lerpChan = (a, b, t) => Math.round(a + (b - a) * t);\nconst interpStops = (r) => {\n  if (r <= 0) return stops[0];\n  if (r >= 100) return stops[5];\n  const idx = r / 20;\n  const i0 = Math.floor(idx);\n  const i1 = Math.min(5, i0 + 1);\n  const t = idx - i0;\n  const c0 = hexToRgb(stops[i0]);\n  const c1 = hexToRgb(stops[i1]);\n  return '#' + [0,1,2].map(k => lerpChan(c0[k], c1[k], t).toString(16).padStart(2, '0')).join('');\n};\nconst labelFg = (r) => {\n  const [rr, gg, bb] = hexToRgb(interpStops(r));\n  return (0.299 * rr + 0.587 * gg + 0.114 * bb) > 150 ? '#1a1a1a' : '#fafafa';\n};\nconst len = (v) => (typeof v.length === 'number' ? v.length : (v.toArray ? v.toArray().length : 0));\nconst at  = (v, i) => (typeof v.get === 'function' ? v.get(i) : v[i]);\n\nconst field = (n) => { const f = series.fields.find(x => x.name === n); return f ? f.values : null; };\nconst wd     = field('weekday_number');\nconst slot   = field('slot_label');\nconst cnt    = field('avg_count');\nconst ratio  = field('crowding_ratio');\nconst samp   = field('sample_count');\nif (!wd || !slot || !cnt || !ratio || !samp || len(wd) === 0) return {};\n\nconst paletteName = context.grafana.replaceVariables('${palette}');\nconst stops = PALETTES[paletteName] || PALETTES.slate;\nconst metric = context.grafana.replaceVariables('${metric}');\n\nconst DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];\n\n// Operating hours per weekday in minutes-since-midnight (isodow: 1=Mon..7=Sun)\nconst OPEN_HOURS_MIN = {\n  1: [6*60, 22*60], 2: [6*60, 22*60], 3: [6*60, 22*60],\n  4: [6*60, 22*60], 5: [6*60, 22*60],   // Mon-Fri 06:00-22:00\n  6: [9*60, 22*60],                     // Sat 09:00-22:00\n  7: [9*60, 18*60],                     // Sun 09:00-18:00\n};\n\n// Build the full y-axis covering every weekday's widest range (06:00-22:00)\n// regardless of which slots have data. Cells outside a weekday's operating\n// hours render as \"closed\"; cells inside hours but missing data render\n// as transparent gaps.\nconst granularity = context.grafana.replaceVariables('${granularity}');\nconst stepMin = granularity === '60min' ? 60 : 30;\nconst rangeStartMin = 6 * 60;\nconst rangeEndMin   = 22 * 60;\nconst yCats = [];\nconst ySlotMins = [];\nfor (let m = rangeStartMin; m < rangeEndMin; m += stepMin) {\n  const h = Math.floor(m / 60), mm = m % 60;\n  yCats.push(String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0'));\n  ySlotMins.push(m);\n}\n\n// Look up SQL rows by (weekday, slot_label)\nconst lookup = {};\nfor (let i = 0; i < len(wd); i++) {\n  lookup[at(wd, i) + '|' + at(slot, i)] = {\n    cnt: at(cnt, i),\n    ratio: at(ratio, i),\n    samp: at(samp, i),\n  };\n}\n\nconst heatData = [];\nfor (let xIdx = 0; xIdx < 7; xIdx++) {\n  const weekday = xIdx + 1;\n  const [openMin, closeMin] = OPEN_HOURS_MIN[weekday];\n  for (let yIdx = 0; yIdx < yCats.length; yIdx++) {\n    const slotLabel = yCats[yIdx];\n    const slotMin   = ySlotMins[yIdx];\n    const isOpen = slotMin >= openMin && slotMin < closeMin;\n    const data = lookup[weekday + '|' + slotLabel];\n    if (data) {\n      const c = Math.round(data.cnt);\n      const r = Math.round(data.ratio * 100);\n      heatData.push({\n        value: [xIdx, yIdx, r, c, r + '%', data.samp],\n        label: { color: labelFg(r) },\n      });\n    } else if (!isOpen) {\n      heatData.push({\n        value: [xIdx, yIdx, 0, 'closed', 'closed', 0],\n        itemStyle: { color: '#202020', borderColor: '#0a0a0a' },\n        label: { color: '#666', show: true, fontStyle: 'italic', formatter: 'closed' },\n      });\n    }\n    // else: in operating hours but no data — skip (transparent gap)\n  }\n}\n\nconst labelIdx = metric === 'crowding_ratio' ? 4 : 3;\n\n\nreturn {\n  grid:    { left: 60, right: 30, top: 40, bottom: 60, containLabel: true },\n  xAxis:   { type: 'category', data: DAYS, position: 'top', axisLabel: { color: '#aaa' }, splitArea: { show: false } },\n  yAxis:   { type: 'category', data: yCats, inverse: true, axisLabel: { color: '#aaa', fontSize: 10 } },\n  visualMap: {\n    type: 'continuous', dimension: 2,\n    min: 0, max: 100, calculable: true,\n    orient: 'horizontal', left: 'center', bottom: 5,\n    inRange: { color: stops },\n    text: ['100%', '0%'],\n    textStyle: { color: '#aaa' },\n  },\n  tooltip: {\n    formatter: (p) => {\n      const [x, y, r, c, _rp, s] = p.value;\n      return DAYS[x] + ' ' + yCats[y] + '<br/>' +\n             'avg_count: ' + c + ' people<br/>' +\n             'crowding_ratio: ' + r + '%<br/>' +\n             'based on ' + s + ' readings';\n    },\n  },\n  series: [{\n    type: 'heatmap',\n    data: heatData,\n    label: {\n      show: true,\n      formatter: (p) => String(p.value[labelIdx]),\n      fontSize: 10,\n    },\n    emphasis: { itemStyle: { borderColor: '#fff', borderWidth: 1 } },\n  }],\n};\n","3":"const PALETTES = {\n  terracotta: ['#ede4d4','#d8c4a0','#caa479','#b8754f','#974a3a','#642822'],\n  sage:       ['#e8e7d6','#c9d2b3','#9eb288','#728c64','#4f6948','#2e4530'],\n  slate:      ['#e6ebef','#bdcad4','#8ea1b1','#5e7689','#3d556a','#22344a'],\n  rose:       ['#ece1de','#dbb9b9','#c08e95','#9a5e72','#6d3f56','#412236'],\n  teal:       ['#dde7e5','#a8c2bf','#6fa097','#487a72','#2e5953','#1a3833'],\n  lavender:   ['#e7e1ec','#c5b4d3','#a08abb','#7e639d','#5a417a','#3a2855'],\n};\n\nconst series = context.panel.data.series && context.panel.data.series[0];\nif (!series || !series.fields) return {};\nconst timeF = series.fields.find(f => f.type === 'time');\nconst valF  = series.fields.find(f => f.type === 'number');\nif (!timeF || !valF) return {};\n\nconst len = (v) => (typeof v.length === 'number' ? v.length : (v.toArray ? v.toArray().length : 0));\nconst at  = (v, i) => (typeof v.get === 'function' ? v.get(i) : v[i]);\n\nconst lineColor = (PALETTES[context.grafana.replaceVariables('${palette}')] || PALETTES.slate)[2];\n\n// Build a category (ordinal) x-axis: each data point becomes one slot,\n// non-operating hours simply don't appear on the axis at all (the\n// Highstock-style \"ordinal\" convention used by financial charts).\n// One category per reading, keyed by \"YYYY-MM-DD HH:MM\" so multiple\n// Mondays don't collide. Day boundaries are recorded for a markLine.\nconst cats = [];\nconst vals = [];\nconst dayBoundaries = [];\nlet prevDay = null;\nfor (let i = 0; i < len(timeF.values); i++) {\n  const t = at(timeF.values, i);\n  const v = at(valF.values, i);\n  const d = new Date(t);\n  const day = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Taipei' }).format(d);\n  const tm  = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Taipei' }).format(d);\n  cats.push(day + ' ' + tm);\n  vals.push(v);\n  if (prevDay !== null && prevDay !== day) {\n    dayBoundaries.push({\n      xAxis: cats.length - 1,\n      lineStyle: { color: 'rgba(255,255,255,0.18)', type: 'dashed', width: 1 },\n      label: { show: false },\n    });\n  }\n  prevDay = day;\n}\n\nreturn {\n  grid: { left: 50, right: 20, top: 36, bottom: 38 },\n  xAxis: {\n    type: 'category',\n    data: cats,\n    boundaryGap: false,\n    axisLabel: {\n      color: '#aaa',\n      hideOverlap: true,\n      formatter: (cat) => {\n        const [day, tm] = cat.split(' ');\n        const wd = new Intl.DateTimeFormat('en', { weekday: 'short', timeZone: 'Asia/Taipei' }).format(new Date(day + 'T00:00:00+08:00'));\n        return wd + '\\n' + tm;\n      },\n    },\n  },\n  yAxis: { type: 'value', axisLabel: { color: '#aaa' }, name: 'people', nameTextStyle: { color: '#aaa' } },\n  tooltip: {\n    trigger: 'axis',\n    axisPointer: { type: 'cross', lineStyle: { color: 'rgba(255,255,255,0.3)' } },\n    formatter: (p) => {\n      const cat = p[0].axisValue;\n      const [day, tm] = cat.split(' ');\n      const wd = new Intl.DateTimeFormat('en', { weekday: 'short', timeZone: 'Asia/Taipei' }).format(new Date(day + 'T00:00:00+08:00'));\n      return wd + ' ' + tm + '<br/>' + p[0].value + ' people';\n    },\n  },\n  series: [{\n    type: 'line',\n    data: vals,\n    showSymbol: false,\n    symbol: 'circle',\n    symbolSize: 8,\n    lineStyle: { color: lineColor, width: 1.8 },\n    itemStyle: { color: lineColor },\n    areaStyle: { color: lineColor, opacity: 0.1 },\n    emphasis: {\n      itemStyle: { color: '#ffffff', borderColor: lineColor, borderWidth: 2 },\n      scale: false,\n    },\n    markLine: { silent: true, symbol: 'none', data: dayBoundaries },\n  }],\n};\n","4":"const PALETTES = {\n  terracotta: ['#ede4d4','#d8c4a0','#caa479','#b8754f','#974a3a','#642822'],\n  sage:       ['#e8e7d6','#c9d2b3','#9eb288','#728c64','#4f6948','#2e4530'],\n  slate:      ['#e6ebef','#bdcad4','#8ea1b1','#5e7689','#3d556a','#22344a'],\n  rose:       ['#ece1de','#dbb9b9','#c08e95','#9a5e72','#6d3f56','#412236'],\n  teal:       ['#dde7e5','#a8c2bf','#6fa097','#487a72','#2e5953','#1a3833'],\n  lavender:   ['#e7e1ec','#c5b4d3','#a08abb','#7e639d','#5a417a','#3a2855'],\n};\nconst len = (v) => (typeof v.length === 'number' ? v.length : (v.toArray ? v.toArray().length : 0));\nconst at  = (v, i) => (typeof v.get === 'function' ? v.get(i) : v[i]);\nconst hexToRgb = (h) => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];\nconst lerpChan = (a, b, t) => Math.round(a + (b - a) * t);\nconst interpStops = (stops, r) => {\n  if (r <= 0) return stops[0];\n  if (r >= 100) return stops[5];\n  const idx = r / 20;\n  const i0 = Math.floor(idx);\n  const i1 = Math.min(5, i0 + 1);\n  const t = idx - i0;\n  const c0 = hexToRgb(stops[i0]); const c1 = hexToRgb(stops[i1]);\n  return '#' + [0,1,2].map(k => lerpChan(c0[k], c1[k], t).toString(16).padStart(2, '0')).join('');\n};\n\nconst series = context.panel.data.series && context.panel.data.series[0];\nif (!series || !series.fields) return {};\nconst f = (n) => { const x = series.fields.find(x => x.name === n); return x ? x.values : null; };\nconst kindF = f('kind');\nconst venueF = f('venue');\nconst tsF = f('ts_ms');\nconst cntF = f('current_count');\nconst medF = f('hist_median');\nconst difF = f('diff');\nconst ratioF = f('ratio');\nconst cmfF = f('comfortable');\nconst capF = f('capacity');\nif (!kindF || !venueF || !cntF || len(kindF) === 0) return {};\n\nconst paletteName = context.grafana.replaceVariables('${palette}');\nconst stops = PALETTES[paletteName] || PALETTES.slate;\n\nconst venues = {};\nfor (let i = 0; i < len(kindF); i++) {\n  const kind = at(kindF, i);\n  const venue = at(venueF, i);\n  if (!venues[venue]) venues[venue] = { summary: null, readings: [] };\n  if (kind === 'summary') {\n    venues[venue].summary = { count: at(cntF, i), median: at(medF, i), diff: at(difF, i), ratio: at(ratioF, i), comfortable: at(cmfF, i), capacity: at(capF, i) };\n  } else if (kind === 'reading') {\n    venues[venue].readings.push([at(tsF, i), at(cntF, i)]);\n  }\n}\nconst venueNames = Object.keys(venues).sort();\nif (venueNames.length === 0) return {};\n\nconst padReadings = (rows) => {\n  if (rows.length <= 1) return rows;\n  const out = [rows[0]];\n  for (let i = 1; i < rows.length; i++) {\n    const gapMs = rows[i][0] - rows[i-1][0];\n    if (gapMs > 60 * 60 * 1000) {\n      out.push([rows[i-1][0] + 1, null]);\n      out.push([rows[i][0] - 1, null]);\n    }\n    out.push(rows[i]);\n  }\n  return out;\n};\n\nconst grids = [];\nconst xAxes = [];\nconst yAxes = [];\nconst seriesOut = [];\nconst graphicEls = [];\nconst lineColor = stops[3];\n\nvenueNames.slice(0, 2).forEach((vname, idx) => {\n  const isLeft = idx === 0;\n  const leftPct = isLeft ? 2 : 52;\n  const rightPct = isLeft ? 52 : 2;\n  grids.push({ left: leftPct + '%', right: rightPct + '%', top: 110, bottom: 14 });\n  xAxes.push({ type: 'time', show: false, gridIndex: idx });\n  yAxes.push({ type: 'value', show: false, gridIndex: idx, min: 0 });\n\n  const v = venues[vname];\n  const data = padReadings(v.readings || []);\n  const lastIdx = data.length - 1;\n  seriesOut.push({\n    type: 'line', name: vname, data: data,\n    xAxisIndex: idx, yAxisIndex: idx,\n    showSymbol: false, connectNulls: false,\n    lineStyle: { color: lineColor, width: 1.6 },\n    itemStyle: { color: lineColor },\n    markPoint: lastIdx >= 0 && data[lastIdx][1] != null ? {\n      symbol: 'circle', symbolSize: 8,\n      itemStyle: { color: '#fff', borderColor: lineColor, borderWidth: 1.5 },\n      label: { show: false },\n      data: [{ coord: data[lastIdx] }],\n    } : undefined,\n  });\n\n  const s = v.summary;\n  if (!s) return;\n  const ratioPct = Math.round((s.ratio || 0) * 100);\n  const bigCol = interpStops(stops, ratioPct);\n  const cmfPct = s.comfortable ? Math.round((s.count / s.comfortable) * 100) + '%' : '—';\n  const capPct = s.capacity ? Math.round((s.count / s.capacity) * 100) + '%' : '—';\n  const subtitle = 'comfortable ' + cmfPct + ' · capacity ' + capPct;\n  const diff = Number(s.diff || 0);\n  const diffColor = diff > 0 ? stops[3] : (diff < 0 ? stops[1] : '#888');\n  const arrow = diff > 0 ? '↑' : (diff < 0 ? '↓' : '–');\n  const diffText = arrow + ' ' + Math.abs(diff).toFixed(0) + ' vs same-slot median';\n  const xCenterPct = isLeft ? '25%' : '75%';\n  graphicEls.push(\n    { type: 'text', left: xCenterPct, top: 12, style: { text: vname, fill: '#9aa', fontSize: 12, textAlign: 'center' } },\n    { type: 'text', left: xCenterPct, top: 30, style: { text: String(s.count), fill: bigCol, fontSize: 40, fontWeight: 'lighter', textAlign: 'center' } },\n    { type: 'text', left: xCenterPct, top: 78, style: { text: subtitle, fill: '#888', fontSize: 11, textAlign: 'center' } },\n    { type: 'text', left: xCenterPct, top: 94, style: { text: diffText, fill: diffColor, fontSize: 12, textAlign: 'center' } },\n  );\n});\n\nreturn {\n  grid: grids,\n  xAxis: xAxes,\n  yAxis: yAxes,\n  series: seriesOut,\n  graphic: { elements: graphicEls },\n  tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },\n};\n"}};

    const state = {
      venue: DATA.venues[0],
      palette: "slate",
      granularity: "60min",
      metric: "avg_count",
    };

    // Re-create the volkovlabs-echarts-panel plugin's `context` object so the
    // panel JS extracted verbatim from grafana/weekly-dashboard.json runs
    // unmodified: it reads context.panel.data.series and
    // context.grafana.replaceVariables('${var}').
    function makeContext(series) {
      return {
        panel: { data: { series: series ? [series] : [] } },
        grafana: {
          replaceVariables: (s) => String(s)
            .split("${palette}").join(state.palette)
            .split("${venue}").join(state.venue)
            .split("${granularity}").join(state.granularity)
            .split("${metric}").join(state.metric),
        },
      };
    }

    const panelFns = {};
    for (const [id, body] of Object.entries(DATA.panelJs)) {
      panelFns[id] = new Function("context", body);
    }

    const charts = {};
    const PANEL_IDS = { panel1: "1", panel2: "2", panel3: "3", panel4: "4" };
    for (const key of Object.keys(PANEL_IDS)) {
      charts[key] = echarts.init(document.getElementById(key));
    }

    function seriesFor(panelKey) {
      if (panelKey === "panel1") return DATA.panel1[state.venue];
      if (panelKey === "panel2") return DATA.panel2[state.venue][state.granularity];
      if (panelKey === "panel3") return DATA.panel3[state.venue];
      if (panelKey === "panel4") return DATA.panel4;
      return null;
    }

    function renderPanel(panelKey) {
      const chart = charts[panelKey];
      let option;
      try {
        option = panelFns[PANEL_IDS[panelKey]](makeContext(seriesFor(panelKey)));
      } catch (e) {
        console.error(panelKey + " render error:", e);
        chart.clear();
        return;
      }
      chart.setOption(option || {}, true);
    }

    function renderAll() {
      Object.keys(PANEL_IDS).forEach(renderPanel);
    }

    // --- selectors ---
    const venueSel = document.getElementById("sel-venue");
    DATA.venues.forEach((v) => {
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      venueSel.appendChild(opt);
    });
    venueSel.value = state.venue;
    venueSel.addEventListener("change", () => {
      state.venue = venueSel.value;
      // panel4 shows both venues, so it does not depend on venue.
      renderPanel("panel1"); renderPanel("panel2"); renderPanel("panel3");
    });

    document.getElementById("sel-palette").addEventListener("change", (e) => {
      state.palette = e.target.value;
      renderAll();
    });
    document.getElementById("sel-granularity").addEventListener("change", (e) => {
      state.granularity = e.target.value;
      renderPanel("panel2");
    });
    document.getElementById("sel-metric").addEventListener("change", (e) => {
      state.metric = e.target.value;
      renderPanel("panel2");
    });

    window.addEventListener("resize", () => {
      Object.values(charts).forEach((c) => c.resize());
    });

    renderAll();
  </script>
</body>
